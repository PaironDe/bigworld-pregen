name: Tests und Worker-Builds

on:
  push:
    branches: [main, aufbau]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  worker:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: BigWorldWorker-windows.exe
            sep: ";"
          - os: ubuntu-22.04
            name: BigWorldWorker-linux
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - name: Worker bauen
        shell: bash
        run: >
          pyinstaller --onefile --name BigWorldWorker
          --paths "$GITHUB_WORKSPACE"
          --add-data "$GITHUB_WORKSPACE/bigworld/web${{ matrix.sep }}web"
          packaging/worker_entry.py
      - name: Datei umbenennen
        shell: bash
        run: |
          if [ -f dist/BigWorldWorker.exe ]; then mv dist/BigWorldWorker.exe "dist/${{ matrix.name }}"; else mv dist/BigWorldWorker "dist/${{ matrix.name }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
